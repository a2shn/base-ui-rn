appId: com.baseuirn.playground
---
- launchApp
- tapOn:
    id: 'button'

- assertVisible: 'Button'

# 1. Counter Button
- assertVisible: '0'
- assertVisible:
    id: 'button-counter'
- tapOn:
    id: 'button-counter'
- assertVisible: '1'

# 2. Disabled State
- assertVisible: 'Disabled Button'
- assertVisible:
    id: 'button-disabled'
    enabled: false
- tapOn:
    id: 'button-disabled'
- assertVisible:
    id: 'button-disabled'
    enabled: false

# 3. Loading State & Accessibility Busy
- assertVisible: 'Loading Button'
- assertVisible: 'Load'
- assertVisible:
    id: 'button-disabled-focusable'
    enabled: true

- tapOn:
    id: 'button-disabled-focusable'

# Verify busy state (accessibilityState.busy)
- assertVisible: 'Loading...'

# 4. Rapid Tapping Edge Case
- tapOn:
    id: 'button-disabled-focusable'
- tapOn:
    id: 'button-disabled-focusable'
- tapOn:
    id: 'button-disabled-focusable'

# Verify that loading state remains
- assertVisible: 'Loading...'

- extendedWaitUntil:
    visible:
      id: 'button-disabled-focusable'
      enabled: true
    timeout: 3000

- assertVisible: 'Load'

# Verify total presses recorded (1 initial + 3 rapid = 4)
- assertVisible:
    id: 'presses-console-value'
    text: '4'
