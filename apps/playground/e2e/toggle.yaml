appId: com.baseuirn.playground
---
- launchApp
- tapOn:
    id: 'toggle'

- assertVisible: 'Toggle'

# 1. Uncontrolled State
- assertVisible:
    id: 'toggle-uncontrolled'
- tapOn:
    id: 'toggle-uncontrolled'
- assertVisible:
    id: 'toggle-uncontrolled'
    checked: true

# 2. Controlled State
- assertVisible: 'OFF'
- assertVisible:
    id: 'toggle-dark-mode'
    checked: false
- tapOn:
    id: 'toggle-dark-mode'
- assertVisible: 'ON'
- assertVisible:
    id: 'toggle-dark-mode'
    checked: true

# 3. Disabled State
- assertVisible: 'Disabled'
- assertVisible:
    id: 'toggle-disabled'
    enabled: false

# 4. Loading/Busy State & Rapid Tapping
- assertVisible: 'Agree Toggle'
- assertVisible: 'Agree'
- tapOn:
    id: 'toggle-disabled-focusable'

- assertVisible: 'Applying...'

# Rapid tapping during loading
- tapOn:
    id: 'toggle-disabled-focusable'
- tapOn:
    id: 'toggle-disabled-focusable'

- assertVisible: 'Applying...'

- extendedWaitUntil:
    visible:
      id: 'toggle-disabled-focusable'
      enabled: true
    timeout: 3000

- assertVisible: 'Agree'
# 1 initial + 2 rapid = 3
- assertVisible:
    id: 'presses-console-value'
    text: '3'
